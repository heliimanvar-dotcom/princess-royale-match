<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Princess Royale — Match 3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#51365e;overflow:hidden}
body{background:linear-gradient(145deg,#ffe6f3,#eee3ff 48%,#dff8ff);position:relative}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(55px);opacity:.5;pointer-events:none}
body:before{width:260px;height:260px;background:#ff9bc8;left:-100px;top:15%}body:after{width:300px;height:300px;background:#9d8cff;right:-130px;bottom:0}
.sparkles{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:48px 48px;opacity:.3;animation:drift 14s linear infinite}@keyframes drift{to{background-position:48px 96px}}
.app{position:relative;z-index:1;width:min(600px,100%);height:100dvh;margin:auto;padding:10px 12px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(25px,7vw,40px);margin:0;letter-spacing:-1.8px;color:#663f71}header p{margin:0;color:#8d7198;font-size:11px}.crown{font-size:34px;filter:drop-shadow(0 4px 5px #8b559744)}
.hud{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px;margin:9px 0}
.cardstat{background:#ffffff92;border:1px solid #fff;backdrop-filter:blur(16px);border-radius:17px;padding:7px 5px;text-align:center;box-shadow:0 7px 22px #704d7930}.cardstat b{display:block;font-size:18px}.cardstat span{font-size:8px;text-transform:uppercase;letter-spacing:.8px;color:#917a99}
.goal{background:#ffffff82;border:1px solid #fff;border-radius:16px;padding:8px 11px;box-shadow:0 7px 22px #704d7930;margin-bottom:8px}.goalrow{display:flex;justify-content:space-between;font-size:11px;font-weight:800}.track{height:7px;background:#fff9;border-radius:20px;margin-top:5px;overflow:hidden}.progress{height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,#ff68ad,#a383ff);transition:width .35s}
.boardShell{position:relative;width:min(560px,100%);margin:auto;padding:8px;border-radius:27px;background:linear-gradient(145deg,#ffffff99,#ffffff45);border:1px solid #fff;box-shadow:0 18px 55px #74507940;backdrop-filter:blur(14px)}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;aspect-ratio:1}
.cell{position:relative;border:0;padding:0;background:none;border-radius:23%;touch-action:none}
.tile{position:absolute;inset:3%;display:grid;place-items:center;border-radius:24%;font-size:clamp(22px,8vw,44px);background:linear-gradient(145deg,#ffffffdd,#ffffff72);box-shadow:inset 0 2px 3px #fff,0 4px 7px #6b476a35;transition:transform .13s cubic-bezier(.2,.9,.2,1),filter .13s}
.tile:after{content:"";position:absolute;top:7%;left:12%;width:38%;height:18%;border-radius:50%;background:#fff9;filter:blur(2px);transform:rotate(-25deg)}
.cell.sel .tile{transform:scale(1.14);filter:drop-shadow(0 0 8px #ff61b0)}
.cell.bad .tile{animation:shake .25s}.cell.pop .tile{animation:pop .34s forwards}.cell.special .tile{animation:pulse 1s infinite alternate}
@keyframes pop{40%{transform:scale(1.28) rotate(7deg);filter:brightness(1.45)}100%{transform:scale(0);opacity:0}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{to{filter:drop-shadow(0 0 9px #ffd05f) scale(1.04)}}
.controls{display:flex;gap:7px;margin-top:8px}.controls button{flex:1}
button{font:inherit;color:#583d62;border:1px solid #fff;background:#ffffff91;border-radius:15px;padding:9px;font-weight:800;box-shadow:0 6px 15px #704d7925}button:active{transform:scale(.96)}.primary{background:linear-gradient(135deg,#ff70ae,#9d83ff);color:white;border:0}
.boosters{display:flex;gap:6px;margin-top:7px}.boost{flex:1;padding:7px;font-size:11px}
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#4c315f55;backdrop-filter:blur(10px)}.overlay.show{display:flex}
.modal{width:min(400px,100%);padding:27px;border-radius:30px;text-align:center;background:linear-gradient(145deg,#fff9fd,#f0ecff);border:1px solid white;box-shadow:0 25px 80px #5e3b6755}.modal .big{font-size:58px}.modal h2{margin:0;font-size:34px}.modal p{color:#846f8c}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.results div{background:#fff9;border-radius:14px;padding:9px}.results b{display:block;font-size:20px}.results span{font-size:9px;color:#917b98;text-transform:uppercase}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none}
@media(max-width:390px){.app{padding:7px 8px}.hud{gap:4px}.cardstat{padding:6px 2px}.cardstat b{font-size:16px}.boardShell{padding:6px}.board{gap:3px}.controls button{padding:8px 5px;font-size:12px}}
</style>
</head>
<body><div class="sparkles"></div><canvas id="fx"></canvas>
<div class="app">
<header><div><h1>👑 Princess Royale</h1><p>Match the royal court • create magical combos ✨</p></div><div class="crown">👑</div></header>
<div class="hud"><div class="cardstat"><b id="score">0</b><span>Score</span></div><div class="cardstat"><b id="moves">24</b><span>Moves</span></div><div class="cardstat"><b id="combo">×1</b><span>Combo</span></div><div class="cardstat"><b id="best">0</b><span>Best</span></div></div>
<div class="goal"><div class="goalrow"><span>✨ Royal Collection</span><span id="goalText">0 / 14</span></div><div class="track"><div id="progress" class="progress"></div></div></div>
<div class="boardShell"><div id="board" class="board"></div></div>
<div class="boosters"><button class="boost" id="shuffle">🔀 Shuffle</button><button class="boost" id="wand">🪄 Royal Wand</button><button class="boost" id="sound">🔊 Sound</button></div>
<div class="controls"><button id="restart">↻ Restart</button><button class="primary" id="new">👑 New Game</button></div>
</div>
<div id="overlay" class="overlay"><div class="modal"><div class="big" id="winIcon">👑</div><h2 id="title">Royal Victory!</h2><p id="message">The kingdom is sparkling!</p><div class="results"><div><b id="finalScore">0</b><span>Score</span></div><div><b id="finalMoves">0</b><span>Moves</span></div><div><b id="finalCombo">×1</b><span>Combo</span></div></div><button class="primary" id="continue">✨ Continue</button></div></div>
<script>
const P=['👸','🧚‍♀️','🧜‍♀️','🧝‍♀️','🦸‍♀️','🤴'],N=8;
let a=[],sel=null,lock=false,score=0,moves=24,goal=14,collected=0,combo=1,sound=true,level=1;
const $=id=>document.getElementById(id),grid=$('board');
const wait=ms=>new Promise(r=>setTimeout(r,ms)), tile=i=>grid.children[i];
function rand(){return Math.floor(Math.random()*P.length)}
function matches(){let s=new Set();for(let r=0;r<N;r++){let run=1;for(let c=1;c<=N;c++){if(c<N&&a[r*N+c]===a[r*N+c-1])run++;else{if(run>=3)for(let k=0;k<run;k++)s.add(r*N+c-1-k);run=1}}}for(let c=0;c<N;c++){let run=1;for(let r=1;r<=N;r++){if(r<N&&a[r*N+c]===a[(r-1)*N+c])run++;else{if(run>=3)for(let k=0;k<run;k++)s.add((r-1-k)*N+c);run=1}}}return[...s]}
function fresh(){do{a=Array.from({length:64},rand)}while(matches().length)}
function render(){grid.innerHTML='';a.forEach((v,i)=>{let b=document.createElement('button');b.className='cell';b.dataset.i=i;b.innerHTML=`<span class="tile">${P[v]}</span>`;b.addEventListener('pointerdown',()=>tap(i));grid.appendChild(b)})}
function update(){let best=+localStorage.getItem('princess-royale-best')||0;$('score').textContent=score;$('moves').textContent=moves;$('combo').textContent='×'+combo;$('best').textContent=best;$('goalText').textContent=`${Math.min(collected,goal)} / ${goal}`;$('progress').style.width=Math.min(100,collected/goal*100)+'%'}
function adjacent(x,y){return Math.abs(Math.floor(x/N)-Math.floor(y/N))+Math.abs(x%N-y%N)===1}
async function tap(i){if(lock)return;if(sel===null){sel=i;tile(i).classList.add('sel');return}if(sel===i){tile(i).classList.remove('sel');sel=null;return}if(!adjacent(sel,i)){tile(sel).classList.remove('sel');sel=i;tile(i).classList.add('sel');return}
 let x=sel,y=i;tile(x).classList.remove('sel');sel=null;lock=true;[a[x],a[y]]=[a[y],a[x]];render();await wait(150);
 let m=matches();if(!m.length){[a[x],a[y]]=[a[y],a[x]];render();tile(x).classList.add('bad');tile(y).classList.add('bad');beep(180,.08);await wait(230);lock=false;return}
 moves--;combo=1;await cascade();update();if(collected>=goal){finish(true);return}if(moves<=0){finish(false);return}lock=false}
async function cascade(){let m=matches(),chain=0;while(m.length){chain++;combo=Math.min(9,Math.round((combo+.8)*10)/10);m.forEach(i=>tile(i)?.classList.add('pop'));collected+=m.length;score+=m.length*12*chain*Math.ceil(combo);beep(450+m.length*35,.07);burst(Math.min(28,m.length*3));await wait(330);m.forEach(i=>a[i]=-1);
 for(let c=0;c<N;c++){let vals=[];for(let r=N-1;r>=0;r--)if(a[r*N+c]>=0)vals.push(a[r*N+c]);for(let r=N-1;r>=0;r--)a[r*N+c]=vals[N-1-r]??rand()}
 render();await wait(120);m=matches()}if(chain>1)combo=Math.min(9,Math.round(combo*10)/10)}
function finish(win){lock=true;$('winIcon').textContent=win?'👑':'💔';$('title').textContent=win?'Royal Victory!':'Out of Moves';$('message').textContent=win?`You rescued the royal court on level ${level}!`:'The princesses are waiting for another royal attempt.';$('finalScore').textContent=score;$('finalMoves').textContent=24-moves;$('finalCombo').textContent='×'+combo;$('continue').textContent=win?'✨ Next Level':'🔄 Try Again';if(win&&score>(+localStorage.getItem('princess-royale-best')||0))localStorage.setItem('princess-royale-best',score);$('overlay').classList.add('show');burst(100);update()}
function start(next=false){if(next)level++;else level=1;goal=12+level*2;moves=24;score=0;collected=0;combo=1;sel=null;lock=false;$('overlay').classList.remove('show');fresh();render();update()}
$('continue').onclick=()=>start($('title').textContent.includes('Victory'));$('restart').onclick=()=>start(false);$('new').onclick=()=>start(false);
$('shuffle').onclick=()=>{if(lock||moves<2)return;moves--;do{a.sort(()=>Math.random()-.5)}while(matches().length);render();update();beep(600,.08)}
$('wand').onclick=async()=>{if(lock)return;let i=Math.floor(Math.random()*64);a[i]=(a[i]+1)%P.length;render();burst(16);beep(800,.1);update()}
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Sound':'🔇 Sound'}
function beep(f,d){if(!sound)return;try{let C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function burst(n){let c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.43,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,s:3+Math.random()*6,t:0}));let f=0;(function go(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.t++;q.x+=q.vx;q.y+=q.vy;q.vy+=.23;x.fillStyle=`hsl(${q.t*10%360} 90% 65%)`;x.fillRect(q.x,q.y,q.s,q.s)});if(f++<80)requestAnimationFrame(go)})()}
start(false);
</script></body></html>
